<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:">
<title>forma-4d-core — demo</title>
<style>
  html,body{margin:0;height:100%;background:#05050A;color:#F2F0EA;font:14px/1.5 system-ui,-apple-system,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;left:16px;bottom:16px;width:min(320px,calc(100% - 32px));padding:14px 16px;border:1px solid rgba(201,169,110,.35);border-radius:14px;background:rgba(9,9,11,.62);backdrop-filter:blur(14px)}
  .ui h1{font-size:15px;margin:0 0 8px;letter-spacing:.02em}
  label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:6px 0;color:#c9c7c0}
  input{width:100%;accent-color:#C9A96E}
  button{font:inherit;color:#F2F0EA;background:#16161b;border:1px solid rgba(201,169,110,.45);border-radius:10px;padding:6px 10px;cursor:pointer}
  button[aria-pressed="true"]{border-color:#E5C478;color:#F6E7B8}
  .row{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<canvas id="cv" aria-label="Four-dimensional form, sliced live"></canvas>
<div class="ui">
  <h1>forma-4d-core</h1>
  <div class="row"><button type="button" data-mat="1" aria-pressed="true">Prism glass</button><button type="button" data-mat="0" aria-pressed="false">Champagne gold</button></div>
  <label>Slice (w)<input id="sl" type="range" min="-60" max="60" value="0"></label>
  <label>Spin<input id="sp" type="range" min="0" max="120" value="45"></label>
  <label>Dispersion<input id="ds" type="range" min="0" max="90" value="45"></label>
  <label>Thickness<input id="th" type="range" min="10" max="80" value="32"></label>
</div>
<script src="src/forma-4d-core.js"></script>
<script src="demo.js"></script>
</body>
</html>
